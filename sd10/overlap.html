}
:root[data-theme="dark"] {

  --dline: #f2f4f7; --dhalo: #111419;
}
.dl-scroll { overflow-x: auto; max-width: 100%; }
table.dl-party { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.dl-party th, table.dl-party td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; position: static; background: none; }
table.dl-party thead th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
table.dl-party tbody th { text-align: left; color: var(--muted); font-weight: 500; }
table.dl-party td:last-child { font-weight: 600; }
.dl-note { font-size: 12.5px; color: var(--muted); margin: 0; }
.dl-note strong { color: var(--ink); font-weight: 600; }
.dl-trendbox { position: relative; }
.dl-trend { display: block; width: 100%; height: auto; overflow: visible; }
.dl-grid { stroke: var(--line); stroke-width: 1; }
.dl-ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.dl-end { font-size: 12px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.dl-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dl-mark { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }

.dl-hit { cursor: crosshair; touch-action: pan-y; }
.dl-tip { position: absolute; top: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .14); pointer-events: none; min-width: 140px; }
.dl-tip .dl-row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.dl-tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.dl-muted { color: var(--muted); }
/* "est." after a number whose early votes are estimated (Seminole precinct cut by a district line) */
.est { font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin-left: 3px; white-space: nowrap; }
/* "(part in SD 10)" after an Orange precinct only partly in the district */
.part { font-family: var(--font-body); font-size: .78em; font-weight: 600; color: var(--muted); white-space: nowrap; letter-spacing: 0; text-transform: none; }
.dbound-halo { fill: none; stroke: var(--dhalo); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .85; }
.dbound { fill: none; stroke: var(--dline); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.dlabels text { fill: var(--dline); stroke: var(--dhalo); paint-order: stroke; font-family: var(--font-display); font-stretch: 87%; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
table.dl-party abbr { text-decoration: none; }
@media (max-width: 480px) {
  table.dl-party { font-size: 12px; }

  table.dl-party tbody th { white-space: normal; line-height: 1.25; }
}
/* visible cue if a table still overflows its card */
.dl-scroll { background: linear-gradient(to right, var(--surface) 30%, transparent) left / 20px 100% no-repeat local,
  linear-gradient(to left, var(--surface) 30%, transparent) right / 20px 100% no-repeat local,
  linear-gradient(to right, rgb(0 0 0 / .18), transparent) left / 8px 100% no-repeat scroll,
  linear-gradient(to left, rgb(0 0 0 / .18), transparent) right / 8px 100% no-repeat scroll; }

}

:root[data-theme="dark"] { --d0: #7478c1; --d1: #b06f35; --d2: #87c6f2; --d3: #493687; --d4: #f3ae58; --d5: #6a3a06; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.page > * { min-width: 0; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-stretch: 87%; font-weight: 700; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 0; text-wrap: balance; }
.asof { color: var(--muted); margin: 0; font-size: 14px; }
.asof strong { color: var(--ink); font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: end; }
.ctl { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 3px; max-width: 100%; }
.seg button { font: inherit; font-weight: 600; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
.chk { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); padding-bottom: 6px; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; }
.legend .lt { color: var(--muted); margin-right: 4px; }
.legend button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.mapbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; }
.mapbox svg { display: block; width: 100%; height: auto; cursor: grab; user-select: none; }
.mapbox svg.dragging { cursor: grabbing; }
.piece { stroke: none; }
.plines { fill: none; stroke: var(--surface); stroke-width: .5; stroke-opacity: .7; vector-effect: non-scaling-stroke; pointer-events: none; }
.oline-halo { fill: none; stroke: var(--dhalo); stroke-width: 5; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .8; }
.oline { fill: none; stroke: var(--dline); stroke-width: 2.4; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.hl { fill: none; stroke: var(--dline); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.seld { fill: none; stroke: var(--dline); stroke-width: 4; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
.zoom button { width: 34px; height: 34px; font: inherit; font-size: 18px; font-weight: 600; line-height: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.zoom button.reset { font-size: 12px; }
.maphint { display: block; font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
.tip .rowhead, .piecebox .rowhead { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.tip .whole, .piecebox .whole { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgb(0 0 0 / .14); min-width: 190px; z-index: 5; }
.tip b { font-family: var(--font-display); font-stretch: 87%; font-size: 15px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .row span:first-child { color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.tag { font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }

.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.detail h2 { font-family: var(--font-display); font-stretch: 87%; font-size: 24px; margin: 0; line-height: 1.1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.detail h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; font-weight: 600; }
.detail .sub { color: var(--muted); font-size: 13px; margin: -8px 0 0; }
.detail dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; font-size: 14px; }
.detail dt { color: var(--muted); }

.note { font-size: 12.5px; color: var(--muted); margin: 0; }

.linkbtn { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }

.chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

section.xt { display: grid; gap: 10px; }
.xthead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; }
h2.sec { font-family: var(--font-display); font-stretch: 87%; font-size: 20px; margin: 0; }
.xtctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.xtctl label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.scroll { overflow: auto; max-height: 680px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.x { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
table.x th, table.x td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.x thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; font-size: 12px; color: var(--muted); font-weight: 600; }
table.x tbody th { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; font-weight: 600; }
table.x thead th:first-child { left: 0; z-index: 3; text-align: left; }
table.x td .v { font-weight: 600; display: block; }

table.x tr.tot th, table.x tr.tot td, table.x td.tot { font-weight: 600; background: color-mix(in srgb, var(--line) 35%, var(--surface)); }
table.x tbody th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

.notes { font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 80ch; }
.notes h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--ink); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .seg button { padding: 6px 9px; font-size: 13px; } }
@media (pointer: coarse) { .legend button { min-height: 40px; } .zoom button { width: 40px; height: 40px; } .mini td { padding-block: 9px; } }
.mini tbody tr:focus-visible, table.x tbody th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>

</div>

const DL = (() => {
  const fmt = n => n == null ? "–" : n.toLocaleString("en-US");
  const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const ocAsOf = (report, earlyThrough, short) => short
    ? `report ${md(report)} (early vote through ${md(earlyThrough)}; mail as logged by ${md(report)} morning)`
    : `report ${md(report)}: early vote through ${md(earlyThrough)}; mail as logged by the morning of ${md(report)}, so the last day or two of mail is incomplete`;
  const MEASURES = [["total_cast", "Ballots cast"], ["vbm_returned", "Mail returned"], ["early_voted", "Early vote"], ["vbm_outstanding", "Mail still out"]];

  // ---- SD 10 data access. Every field name the pages read for the two-county
  // geography is resolved here (plus the page-level accessors marked "Data access"
  // in each template), so a schema change is fixed in one place.
  //   precinct / piece: id or precinct ("ORA-506", "SEM-017"), county ("ORA"/"SEM"
  //     or a name; else taken from the id prefix), partial, estimated (or est)

  //     else single top-level fields; OC Dems card (see ocCard)
  //   type: short (or prefix) for the type's short name
  const COUNTY_NAMES = { ORA: "Orange", SEM: "Seminole" };
  const PART_NOTE = "(part in SD 10)";
  const countyName = c => c == null ? "" : COUNTY_NAMES[c] || String(c);
  const countyOf = rec => rec.county ?? String(rec.id ?? rec.precinct ?? "").split("-")[0];
  // "ORA-506" -> "506", "SEM-017a" -> "017a"

  const precCounty = id => { const s = String(id), i = s.indexOf("-"); return i >= 0 ? countyName(s.slice(0, i)) : ""; };

  const precName = (id, partial, html) => `${precCounty(id)} precinct ${precNum(id)}` +
    (partial ? (html ? ` <span class="part">${PART_NOTE}</span>` : " " + PART_NOTE) : "");

  // short form for the label fit rule: "HD 37" -> "37", "Orange CC 5" -> "Ora 5",
  // "Seminole SB 1" -> "Sem 1" (both counties have a CC 5, so the county stays); County labels stay whole

  function shortLabel(key, label) {

  // per-county TQV as-of and sources, as [{code, name, as_of_et, as_of_utc, last_date, baseline_et, source, ...}]
  function counties(meta) {
    let c = meta && (meta.counties || meta.tqv_counties || (meta.tqv && typeof meta.tqv === "object" ? meta.tqv : null));

    if (!c || !c.length) c = [{ ...meta, county: null }];

      baseline_et: v.baseline_et,

  // "Sun Nov 1, 2:20 PM EST (Orange) and Sun Nov 1, 2:10 PM EST (Seminole)"; wrap(s) formats each value
  function perCounty(list, field, wrap = s => s) {

  }
  // The one OC Dems card (state_senate / 10 rows = the Orange part of SD 10), from
  // DIST.ocdems (or DIST.ocdems_sd10 / ocdems_card, or the same names under DIST.meta).
  // Fields read: title|label, latest_report, latest_early_through, latest {measure: {party}},
  // reports (["2026-10-06", ...] or [{report, early_through}]; early_through falls back to
  // meta.ocdems_reports), series {measure: {party: [...]}}, compare {tqv_as_of_et,
  // ocdems_report, ocdems_early_through, orange_sd10 {measure: {tqv, ocdems, diff, pct}},

  function ocCard(DIST) {

    const obj = x => x && typeof x === "object" ? x : null;
    const c = obj(DIST.ocdems) || obj(DIST.ocdems_sd10) || obj(DIST.ocdems_card) || obj(M.ocdems_sd10) || obj(M.ocdems_card) || obj(M.ocdems);

  }

  function prevDay(iso) { if (!iso) return iso; const d = new Date(Date.parse(iso + "T12:00:00Z") - 864e5); return d.toISOString().slice(0, 10); }

  function decodeArcs(T) {
    const q = T.q;
    return T.arcs.map(a => {
      const pts = []; let x = T.origin[0], y = T.origin[1];
      for (let i = 0; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; pts.push([x / q, y / q]); }

    return {

      },

  const size = r.est_eligible != null ? ` Those parts hold ${fmt(r.est_eligible)} of the ${fmt(r.eligible)} eligible voters${r.est_ballots != null ? ` and ${fmt(r.est_ballots)} of the ${fmt(r.total)} ballots` : ""}.` : "";
  const ar = area.length ? ` In ${precList(area, DEST.area_share_labels || DEST.precinct_labels)}, eligible voters and mail are estimated too (split by area).` : "";
  return `<p class="note"><span class="est">est.</span> ${parts}${size}${ar}</p>`;
}
function renderDetail() {
  const el = document.getElementById("detail");
  const T = TY[colorKey];
  const pieceBox = selPiece != null ? `<div class="piecebox">${pieceHTML(PIECES[selPiece], true)}</div>` : "";
  if (!selD) {
    const anyEst = T.districts.some(id => estTags(D[colorKey][id]).et);
    el.innerHTML = `<h2>${T.name} districts</h2>
      <p class="note">${T.districts.length} districts in SD 10; ${T.split_precincts ? `${T.split_precincts} precincts are split by these lines` : "no precinct is split by these lines"}. Counts cover only the part of each district inside SD 10.</p>
      <table class="mini"><thead><tr><th>District</th><th>Eligible</th><th>Ballots</th><th>Turnout</th></tr></thead><tbody>
      ${T.districts.map(id => { const r = D[colorKey][id]; return `<tr data-id="${id}"><td><span class="chip" style="background:${dfill(colorKey, id)}"></span>${r.label}${estTags(r).et}</td><td>${fmt(r.eligible)}</td><td>${fmt(r.total)}</td><td>${pct(r.turnout)}</td></tr>`; }).join("")}
      </tbody></table>
      <p class="note">Turnout = ballots cast ÷ eligible voters (TQV, ${ASOF}). SD 10: ${pct(SD.total / SD.eligible)} of ${fmt(SD.eligible)}.${anyEst ? ` <span class="est">est.</span> = includes parts of Seminole precincts cut by these lines, whose early vote is estimated.` : ""}</p>
      <p class="note">Hover an area for its precinct, split and districts. Click an area, a legend chip or a row to open a district.</p>`;
    el.querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("click", () => { selD = tr.dataset.id; selPiece = null; paint(); }));
    DL.keyRows(el);
    return;
  }
  const r = D[colorKey][selD], { e, ee, et } = estTags(r);
  el.innerHTML = `${pieceBox}<h2>${r.label}</h2>
    <p class="sub">${T.name} · SD 10 part</p>
    <div><div class="big">${pct(r.turnout)}${et}</div><p class="note">turnout to date: ballots cast ÷ eligible voters · TQV, ${ASOF}</p></div>
    <dl><dt>Eligible voters</dt><dd>${fmt(r.eligible)}${ee}</dd>
      <dt>Ballots cast (TQV)</dt><dd>${fmt(r.total)}${e}</dd>
      <dt>Early vote · Mail</dt><dd>${fmt(r.ev)} · ${fmt(r.mail)}${et}</dd>
      ${ED ? `<dt>Election Day</dt><dd>${fmt(r.ed || 0)}${e}</dd>` : ""}
      <dt>Precincts</dt><dd>${r.precincts.length}${r.split_precincts.length ? ` (${r.split_precincts.length} split)` : ""}</dd>
      <dt>Sub-precinct pieces</dt><dd>${r.pieces.length}</dd></dl>
    ${estNote(r, T)}
    <h3>Overlaps (share of eligible voters)</h3>
    <div class="ovl">${overlapsHTML(colorKey, selD)}</div>
    <details class="note"><summary>${r.precincts.length} precincts${r.split_precincts.length ? `, ${r.split_precincts.length} split by this line (†)` : ""}</summary>${precinctList(r)}</details>
    <button type="button" class="linkbtn" id="clr">Back to all ${T.name} districts</button>`;
  document.getElementById("clr").addEventListener("click", () => { selD = null; selPiece = null; paint(); });
}

// ---- overlap table
const xr = document.getElementById("xrows"), xc = document.getElementById("xcols");
const opts = sel => TYPES.map(t => `<option value="${t.key}">${typeOpt(t)}</option>`).join("");
xr.innerHTML = opts(); xc.innerHTML = opts();
xr.value = TYPES[0].key; xc.value = (TYPES.find(t => t.key === "congress") || TYPES[1]).key;
function matrix(a, b) {
  const key = `${a}|${b}`, rkey = `${b}|${a}`;
  if (DIST.overlaps[key]) return DIST.overlaps[key];
  const o = DIST.overlaps[rkey];
  return { rows: o.cols, cols: o.rows, eligible: o.cols.map((_, j) => o.rows.map((_, i) => o.eligible[i][j])) };
}
function renderX() {
  const a = xr.value, b = xc.value, tbl = document.getElementById("xtable"), note = document.getElementById("xnote");
  if (a === b) { tbl.innerHTML = ""; note.textContent = "Pick two different district types."; return; }
  const m = matrix(a, b);
  const rt = m.eligible.map(r => r.reduce((x, y) => x + y, 0));
  const ct = m.cols.map((_, j) => m.eligible.reduce((x, r) => x + r[j], 0));
  const all = rt.reduce((x, y) => x + y, 0);
  // the cells are eligible voters, so only an estimate of eligible voters earns "est." here
  const ee = (k, id) => DL.estEligTag(D[k][id], DEST);
  const anyEst = m.rows.some(r => ee(a, r)) || m.cols.some(c => ee(b, c));
  note.innerHTML = `Each cell: eligible voters living in both districts, within SD 10 (TQV, ${ASOF}), then the share of the row district and of the column district. Shading follows the row share.` +
    (anyEst ? ` <span class="est">est.</span> = the district's eligible voters include a Seminole precinct split by area estimate.` : "");
  tbl.innerHTML = `<thead><tr><th>${tshort(TY[a])} \\ ${tshort(TY[b])}</th>${m.cols.map(c => `<th>${lab(b, c)}${ee(b, c)}</th>`).join("")}<th>Total</th></tr></thead><tbody>` +
    m.rows.map((r, i) => `<tr><th><button type="button" data-k="${a}" data-id="${r}"><span class="chip" style="background:${dfill(a, r)}"></span>${lab(a, r)}${ee(a, r)}</button></th>` +
      m.eligible[i].map((v, j) => v ? `<td style="background:color-mix(in srgb, var(--accent) ${Math.round(40 * v / rt[i])}%, var(--surface))"><span class="v">${fmt(v)}</span><span class="s">${share(v / rt[i])} of row · ${share(v / ct[j])} of col</span></td>` : `<td class="zero">·</td>`).join("") +
      `<td class="tot"><span class="v">${fmt(rt[i])}</span><span class="s">${share(rt[i] / all)} of SD 10</span></td></tr>`).join("") +
    `<tr class="tot"><th>Total</th>${ct.map(v => `<td><span class="v">${fmt(v)}</span><span class="s">${share(v / all)} of SD 10</span></td>`).join("")}<td><span class="v">${fmt(all)}</span></td></tr></tbody>`;
}
xr.addEventListener("change", renderX); xc.addEventListener("change", renderX);
document.getElementById("xtable").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  colorKey = b.dataset.k; if (overlayKey === colorKey) overlayKey = ""; selD = b.dataset.id; selPiece = null; paint();
  mapbox.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

// ---- zoom / pan via viewBox
let vb = { x: 0, y: 0, w: W, h: H };
function scaleLabels() {
  const px = svg.clientWidth || W;
  const u = vb.w / px;  // user units per screen pixel
  gLab.setAttribute("font-size", (13 * u).toFixed(2));
  gLab.setAttribute("stroke-width", (3.2 * u).toFixed(2));
  lastU = u; relayout();  // label fit depends on scale and, at the map edge, on panning
}
const setVB = () => { svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); scaleLabels(); };
function clampVB() { vb.w = Math.min(W, Math.max(W / 16, vb.w)); vb.h = vb.w * H / W; vb.x = Math.min(W - vb.w, Math.max(0, vb.x)); vb.y = Math.min(H - vb.h, Math.max(0, vb.y)); }
function zoomAt(f, cx, cy) { vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f; vb.w *= f; clampVB(); setVB(); }
function svgPoint(e) { const r = svg.getBoundingClientRect(); return [vb.x + (e.clientX - r.left) / r.width * vb.w, vb.y + (e.clientY - r.top) / r.height * vb.h]; }
svg.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = svgPoint(e); zoomAt(e.deltaY > 0 ? 1.2 : 1 / 1.2, x, y); }, { passive: false });
document.getElementById("zin").addEventListener("click", () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2));
document.getElementById("zout").addEventListener("click", () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2));
document.getElementById("zreset").addEventListener("click", () => { vb = { x: 0, y: 0, w: W, h: H }; setVB(); });
window.addEventListener("resize", scaleLabels);
let drag = null; const pointers = new Map();
svg.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, e);
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, moved: false, target: e.target };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag = { pinch: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), w: vb.w }; }
});
svg.addEventListener("pointermove", e => {
  if (!drag || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  const r = svg.getBoundingClientRect();
  if (drag.pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2; vb.w = drag.w * drag.pinch / d; clampVB(); vb.x = cx - vb.w / 2; vb.y = cy - vb.h / 2; clampVB(); setVB(); return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId); tip.hidden = true; }
  if (drag.moved) { vb.x = drag.vx - dx / r.width * vb.w; vb.y = drag.vy - dy / r.height * vb.h; clampVB(); setVB(); }
});
function endPointer(e) {
  const wasTap = drag && !drag.pinch && !drag.moved, target = drag && drag.target;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    svg.classList.remove("dragging");
    if (wasTap && e.type === "pointerup") {
      const i = target && target.dataset && target.dataset.i;
      if (i != null) { selPiece = +i; selD = PIECES[+i].tags[colorKey]; } else { selPiece = null; selD = null; }
      paint();
    }
    drag = null;
  }
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

// ---- notes
const bsrc = DL.boundarySources(M);
const anyEstAll = TYPES.some(t => t.districts.some(id => estTags(D[t.key][id]).et));
document.getElementById("notes").innerHTML = `<h2>About this data</h2><ul>
  <li>District lines: ${bsrc ? esc(bsrc.replace(/\.\s*$/, "")) : "Orange County SOE sub-precinct layer (precinct splits tagged with their districts); Seminole County SOE precinct map"}. Each piece carries its ${TYPES.map(t => t.name).join(", ")} district, so precincts split by a line are split here too.</li>
  <li>Turnout, ballots and eligible voters: ${MC.map(c => `${c.name ? c.name + ": " : ""}${esc(c.source || "Florida Turnout Quick View (public SOE feed)")}, as of ${c.as_of_et}${c.as_of_utc ? ` (${c.as_of_utc})` : ""}`).join("; ")}. ${LASTD} ${LASTD.includes(" and ") ? "are partial days" : "is a partial day"}. Ballots cast = mail + early vote${ED ? " + Election Day" : ""}; ${ED ? "Election Day ballots are included as the feed reports them" : "Election Day ballots are not in yet"}. Ballots are counted where the voter lives. Public, aggregate counts only.</li>
  <li>Senate District 10 = all of Seminole County plus part of Orange County. District counts cover only the part of each district inside SD 10.${PARTIAL.size ? ` ${PARTIAL.size} Orange precincts are only partly in SD 10; they are marked “${DL.PART_NOTE}” and only their SD 10 part is counted.` : ""} Seminole precinct 888 has no voters, no ballots and no polygon, so it is left off the map.</li>
  <li>${anyEstAll ? `<span class="est">est.</span> = estimated. ${DEST.note ? esc(DEST.note) : `Seminole reports early votes by whole precinct only. Where a district line cuts a Seminole precinct, the counts of each part are estimated from its share of the precinct's voters.${DEST.eligible != null ? ` ${fmt(DEST.eligible)} eligible voters (${pct(DEST.share_of_sd10 ?? DEST.eligible / SD.eligible)} of SD 10) are in such parts.` : ""} Whole-precinct and SD 10 totals are exact.`}`
    : "Seminole reports early votes by whole precinct only, so a count below a whole Seminole precinct would have to be estimated and would be marked “est.”. No number here needed that."}</li>
  <li>Party breakdowns: the OC Dems sheet covers Orange County only, so it has no rows for these districts' SD 10 parts. The turnout map shows it for the Orange part of SD 10 as a whole.</li>
  <li>Colours only tell neighbouring districts apart; the label names the district (shortened, e.g. “HD 37” to “37” or “Seminole CC 5” to “Sem 5”, or hidden, where it doesn't fit at the current zoom; hover or select a district to show it). Neighbouring colours are checked to stay distinguishable with deuteranopia and protanopia. Lines are simplified to about 3 m.</li>
  <li>Built ${M.built_utc.replace("T", " ").replace("Z", " UTC")}. ${DIST.checks.filter(c => c.ok).length} of ${DIST.checks.length} build checks passed.</li></ul>`;

paint();
renderX();
</script>
