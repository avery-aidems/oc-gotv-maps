<div class="page">

  </header>

  <div class="stats" id="stats"></div>

  </div>

  <div class="work">
    <div class="mapbox" id="mapbox">
      <svg id="map" role="img" aria-label="Map of Senate District 10 precincts shaded by turnout"></svg>
      <div class="zoom">

const DL = (() => {
  const fmt = n => n == null ? "–" : n.toLocaleString("en-US");
  const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const ocAsOf = (report, earlyThrough, short) => short
    ? `report ${md(report)} (early vote through ${md(earlyThrough)}; mail as logged by ${md(report)} morning)`
    : `report ${md(report)}: early vote through ${md(earlyThrough)}; mail as logged by the morning of ${md(report)}, so the last day or two of mail is incomplete`;
  const MEASURES = [["total_cast", "Ballots cast"], ["vbm_returned", "Mail returned"], ["early_voted", "Early vote"], ["vbm_outstanding", "Mail still out"]];

  // ---- SD 10 data access. Every field name the pages read for the two-county
  // geography is resolved here (plus the page-level accessors marked "Data access"
  // in each template), so a schema change is fixed in one place.
  //   precinct / piece: id or precinct ("ORA-506", "SEM-017"), county ("ORA"/"SEM"
  //     or a name; else taken from the id prefix), partial, estimated (or est)

  //     else single top-level fields; OC Dems card (see ocCard)
  //   type: short (or prefix) for the type's short name
  const COUNTY_NAMES = { ORA: "Orange", SEM: "Seminole" };
  const PART_NOTE = "(part in SD 10)";
  const countyName = c => c == null ? "" : COUNTY_NAMES[c] || String(c);
  const countyOf = rec => rec.county ?? String(rec.id ?? rec.precinct ?? "").split("-")[0];
  // "ORA-506" -> "506", "SEM-017a" -> "017a"

  const precCounty = id => { const s = String(id), i = s.indexOf("-"); return i >= 0 ? countyName(s.slice(0, i)) : ""; };

  const precName = (id, partial, html) => `${precCounty(id)} precinct ${precNum(id)}` +
    (partial ? (html ? ` <span class="part">${PART_NOTE}</span>` : " " + PART_NOTE) : "");

  // short form for the label fit rule: "HD 37" -> "37", "Orange CC 5" -> "Ora 5",
  // "Seminole SB 1" -> "Sem 1" (both counties have a CC 5, so the county stays); County labels stay whole

  function shortLabel(key, label) {

  // per-county TQV as-of and sources, as [{code, name, as_of_et, as_of_utc, last_date, baseline_et, source, ...}]
  function counties(meta) {
    let c = meta && (meta.counties || meta.tqv_counties || (meta.tqv && typeof meta.tqv === "object" ? meta.tqv : null));

    if (!c || !c.length) c = [{ ...meta, county: null }];

      baseline_et: v.baseline_et,

  // "Sun Nov 1, 2:20 PM EST (Orange) and Sun Nov 1, 2:10 PM EST (Seminole)"; wrap(s) formats each value
  function perCounty(list, field, wrap = s => s) {

  }
  // The one OC Dems card (state_senate / 10 rows = the Orange part of SD 10), from
  // DIST.ocdems (or DIST.ocdems_sd10 / ocdems_card, or the same names under DIST.meta).
  // Fields read: title|label, latest_report, latest_early_through, latest {measure: {party}},
  // reports (["2026-10-06", ...] or [{report, early_through}]; early_through falls back to
  // meta.ocdems_reports), series {measure: {party: [...]}}, compare {tqv_as_of_et,
  // ocdems_report, ocdems_early_through, orange_sd10 {measure: {tqv, ocdems, diff, pct}},

  function ocCard(DIST) {

    const obj = x => x && typeof x === "object" ? x : null;
    const c = obj(DIST.ocdems) || obj(DIST.ocdems_sd10) || obj(DIST.ocdems_card) || obj(M.ocdems_sd10) || obj(M.ocdems_card) || obj(M.ocdems);

  }

  function prevDay(iso) { if (!iso) return iso; const d = new Date(Date.parse(iso + "T12:00:00Z") - 864e5); return d.toISOString().slice(0, 10); }

  function decodeArcs(T) {
    const q = T.q;
    return T.arcs.map(a => {
      const pts = []; let x = T.origin[0], y = T.origin[1];
      for (let i = 0; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; pts.push([x / q, y / q]); }

    return {

      },

    <dl><dt>Turnout (TQV)</dt><dd>${DL.pct(r.turnout)}${et}</dd><dt>Eligible voters</dt><dd>${fmt(r.eligible)}${ee}</dd>
    <dt>Ballots cast</dt><dd>${fmt(r.total)}${e}</dd><dt>Not yet voted</dt><dd>${fmt(Math.max(0, r.eligible - r.total))}${et}</dd></dl>
    <p class="note">TQV as of ${D_ASOF}. SD 10 part only.${et ? " est. = includes estimated counts." : ""}</p>
    <button type="button" class="linkbtn" id="dgo">Full district details ↓</button>`;
  document.getElementById("dgo").addEventListener("click", () => {
    const panel = document.getElementById("dpanel");
    panel.scrollIntoView({ block: "start", behavior: reduced() ? "auto" : "smooth" });
    document.getElementById("dptitle").focus({ preventScroll: true });
  });
}
function renderDistrictPanel() {
  const fk = DL.focusKey();
  renderMini();
  const panel = document.getElementById("dpanel");
  panel.hidden = layer === "none";
  if (layer === "none") { DL.restoreFocus(fk); return; }
  const T = DTY[layer];
  document.getElementById("dptitle").textContent = `${T.name} districts`;
  document.getElementById("dsel").innerHTML = `<option value="">Choose a district…</option>` +
    T.districts.map(id => `<option value="${id}" ${id === dSelected ? "selected" : ""}>${DD[layer][id].label}</option>`).join("");
  const grid = document.getElementById("dpgrid");
  grid.classList.toggle("one", !!dSelected && layer === "county");  // the County layer has no by-county card
  if (!dSelected) {
    grid.innerHTML = `<div class="dcard" style="grid-column:1/-1"><p class="note">${splitText() || "Click the map, a row below, or pick a district to see its turnout in SD 10."}
      ${T.split_precincts ? `${T.split_precincts} precincts are split by these lines; each piece is counted in its own district.` : "No precinct is split by these lines."}</p></div>`;
  } else {
    const r = DD[layer][dSelected], { e, ee, et } = estTags(r);
    grid.innerHTML = `<div class="dcard">
        <h3>${r.label}</h3>
        <h4>Turnout to date · TQV, ${D_ASOF}</h4>
        <div><div class="big num">${DL.pct(r.turnout)}${et}</div><p class="note">ballots cast ÷ eligible voters in the SD 10 part, rolled up from the precinct splits. ${D_LASTD} ${D_LASTD.includes(" and ") ? "are partial days" : "is a partial day"}.</p></div>
        ${barHTML(r.ev, r.mail, r.eligible, r.ed || 0)}
        <dl><dt>Eligible voters</dt><dd>${fmt(r.eligible)}${ee}</dd>
          <dt>Early vote</dt><dd>${fmt(r.ev)}${e}</dd>
          <dt>Mail</dt><dd>${fmt(r.mail)}${ee}</dd>
          ${D_ED ? `<dt>Election Day</dt><dd>${fmt(r.ed || 0)}${e}</dd>` : ""}
          <dt>Not yet voted</dt><dd>${fmt(Math.max(0, r.eligible - r.total))}${et}</dd>
          <dt>Precincts</dt><dd>${r.precincts.length}${r.split_precincts.length ? ` (${r.split_precincts.length} split)` : ""}</dd></dl>
        ${estNote(r)}
        <button type="button" class="linkbtn" id="dzoom">Zoom to ${r.label}</button>
      </div>
      ${layer === "county" ? "" : `<div class="dcard">${byCountyHTML(r)}</div>`}`;
    document.getElementById("dzoom").addEventListener("click", zoomToDistrict);
  }
  const dt = document.getElementById("dtable");
  dt.innerHTML = `<thead><tr><th>District</th><th>Eligible</th><th>Ballots cast</th><th>Early vote</th><th>Mail</th>${D_ED ? "<th>Election Day</th>" : ""}<th>Turnout (TQV)</th><th>Not yet voted</th><th>Precincts</th></tr></thead><tbody>` +
    T.districts.map(id => { const r = DD[layer][id];
      return `<tr data-id="${id}" class="${id === dSelected ? "on" : ""}" aria-selected="${id === dSelected}"><td>${r.label}${estTags(r).et}</td><td>${fmt(r.eligible)}</td><td>${fmt(r.total)}</td>` +
        `<td>${fmt(r.ev)}</td><td>${fmt(r.mail)}</td>${D_ED ? `<td>${fmt(r.ed || 0)}</td>` : ""}<td>${DL.pct(r.turnout)}</td><td>${fmt(Math.max(0, r.eligible - r.total))}</td><td>${r.precincts.length}</td></tr>`; }).join("") + `</tbody>`;
  DL.keyRows(dt);
  document.getElementById("dpnote").innerHTML = `TQV as of ${D_ASOF}. Counts cover only the part of each district inside SD 10.` +
    (T.districts.some(id => estTags(DD[layer][id]).et) ? ` <span class="est">est.</span> = the district includes parts of Seminole precincts cut by these lines, whose early vote is estimated (see the district card and About this data).` : "");
  DL.restoreFocus(fk);
}
// The one OC Dems card: the sheet's SD 10 rows, which cover the Orange part of SD 10 only.
function renderOC() {
  const fk = DL.focusKey();
  const grid = document.getElementById("ocgrid");
  if (!OC) { grid.innerHTML = `<div class="dcard" style="grid-column:1/-1"><p class="note">No OC Dems data in this build.</p></div>`; return; }
  const ora = CT.Orange || { eligible: 0, total: 0 }, sem = CT.Seminole || { eligible: 0 };
  const oraMeta = DMC.find(c => c.name === "Orange") || DMC[0];
  const reps = OC.reports, hasTrend = !!(OC.series && reps.length > 1);
  grid.innerHTML = `<div class="dcard">
      <h4>OC Dems sheet · ${DL.ocAsOf(OC.latest_report, OC.latest_early_through)}</h4>
      <p class="note"><strong style="color:var(--ink)">Orange part only.</strong> The OC Dems sheet covers Orange County voters, so these counts are for the
        ${fmt(ora.eligible)} eligible voters in the Orange part of SD 10 (${pct(ora.eligible / ELIG, 0)} of the district). Seminole's ${fmt(sem.eligible)} are not in it.</p>
      ${DL.partyTable(OC.latest)}
      <p class="note">TQV for the same area, as of ${oraMeta.as_of_et}: ${fmt(ora.total)} ballots cast, ${pct(ora.total / ora.eligible)} of eligible. That is a different moment, so don't subtract one from the other.</p>
      ${OC.compare ? `<p class="dl-note">${DL.compareNote(OC)}</p>` : ""}
    </div>
    <div class="dcard">${hasTrend ? `
      <div class="dphead" style="align-items:center">
        <h4>Daily trend by party · reports ${DL.md(reps[0].report)}–${DL.md(reps[reps.length - 1].report)}</h4>
        <div class="seg small" id="tmeasure" role="group" aria-label="Trend measure">
          <button type="button" data-m="total_cast" aria-pressed="${trendMeasure === "total_cast"}">Ballots cast</button>
          <button type="button" data-m="vbm_outstanding" aria-pressed="${trendMeasure === "vbm_outstanding"}">Mail still out</button>
        </div>
      </div>
      <div class="dl-trendbox" id="trend"></div>
      <p class="note">${trendMeasure === "total_cast"
        ? "Cumulative, by registered party, Orange part of SD 10. Reports before 10/20 cover mail only, so ballots cast there = mail returned (early voting began 10/19). In each report early vote runs through the day before; mail is as logged that morning, so recent mail lags. Days without a report are bridged."
        : "Mail ballots sent and not yet returned, Orange part of SD 10. From the 10/20 report on, the sheet leaves out mail voters who already voted early, so the line drops there. Recent returns lag by a day or two because of mail logging."}</p>`
      : `<h4>Daily trend by party</h4><p class="note">No daily series in this build.</p>`}
    </div>`;
  if (hasTrend) {
    DL.trend(document.getElementById("trend"), OC, trendMeasure);
    document.getElementById("tmeasure").addEventListener("click", e => {
      const b = e.target.closest("button"); if (b) { trendMeasure = b.dataset.m; renderOC(); } });
  }
  DL.restoreFocus(fk);
}
document.getElementById("dsel").addEventListener("change", e => selectDistrict(e.target.value, true));
// re-render on real width changes only (not mobile URL-bar height changes)
let dResize, lastWidth = window.innerWidth;
window.addEventListener("resize", () => {
  scaleDLabels();
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(dResize); dResize = setTimeout(() => { if (layer !== "none" && dSelected) renderDistrictPanel(); renderOC(); }, 200);
});
document.getElementById("dtable").addEventListener("click", e => { const id = e.target.closest("tr")?.dataset.id; if (id) selectDistrict(id, true); });
setLayer("none");

// Notes
const nPartial = P.filter(p => p.partial).length;
// "est." appears only where a precinct or a district is flagged (not inferred from the pieces)
const anyEst = P.some(DL.isEst) || DTYPES.some(t => t.districts.some(id => estTags(DD[t.key][id]).et));
const hidesProv = MC.filter(c => (c.hide_types || []).includes("Provisional")).map(c => c.name).filter(Boolean);
const regd = MC.filter(c => c.registered_summary != null);
// a county file's summary vs the sum of the map's precincts in that county: Orange's summary
// covers the whole county (SD 10 has only part of it); Seminole's should be close to its sum
const regNote = c => {
  const sum = (CT[c.name] || {}).eligible || 0, partOnly = P.some(p => p.cname === c.name && p.partial) || c.registered_summary > 1.05 * sum;
  return partOnly
    ? `${c.name}'s file summary (${fmt(c.registered_summary)} eligible) covers the whole county; the SD 10 part is the sum of its precinct parts (${fmt(sum)}).`
    : `${c.name}'s file summary (${fmt(c.registered_summary)}) differs slightly from the sum of its precincts (${fmt(sum)}).`;
};
const castParts = `mail + early vote${ED ? " + Election Day" : ""}`;
const bsrc = DL.boundarySources(DM);
document.getElementById("notes").innerHTML = `<h2>About this data</h2><ul>
  <li>Turnout source: ${MC.map(c => `${c.name ? c.name + ": " : ""}${DL.esc(c.source || "Florida Turnout Quick View (public SOE feed)")}, as of ${c.as_of_et}`).join("; ")}.${MC.length > 1 ? " Each county's copy is saved separately, so the two as-of times can differ." : ""} Public, aggregate counts only. No voter-level data.</li>
  <li>Senate District 10 = all of Seminole County plus part of Orange County.${nPartial ? ` ${nPartial} Orange precincts are only partly in SD 10. They are marked “${DL.PART_NOTE}”, and their numbers count only the voters in that part.` : ""}</li>
  <li>Turnout = ballots cast (${castParts}) ÷ the precinct's eligible voters in the same file (${fmt(ELIG)} across SD 10).${regd.length ? ` ${regd.map(regNote).join(" ")} The map uses the precinct sums.` : ""}</li>
  <li>“Change since ${BL.label}” compares with ${DM.baseline_desc || M.baseline_desc ? DL.esc(BL.desc) : `the ${MC.length > 1 ? "copies" : "copy"} last updated ${DL.perCounty(MC, "baseline_et")}, which is close to the end of ${BL.label}`}. Mail ballots are logged a day or two late, so a little of the change is mail from before then.</li>
  <li>“Not yet voted” = the precinct's eligible voters minus its ballots cast (${fmt(P.reduce((a, p) => a + (p.left || 0), 0))} across SD 10). It is a raw count, not a share, so larger precincts shade darker. It includes voters with a mail ballot still out.</li>
  <li>${partialDay}. ${ED ? "Election Day ballots are included as the feed reports them; they are not final until the count is complete." : "Election Day ballots are not in yet."} Provisional ballots are not counted here${hidesProv.length ? ` (${hidesProv.join(" and ")} ${hidesProv.length > 1 ? "hide" : "hides"} them in this feed)` : ""}.</li>
  <li>Ballots are counted where the voter lives (their precinct), not where they voted.</li>
  <li>Precincts shown with hatching have no ballot or eligible-voter rows in the source. Seminole precinct 888 is in the county's precinct table but has no voters, no ballots and no polygon, so it is left off the map.</li>
  <li>Precinct and district lines: ${bsrc ? DL.esc(bsrc.replace(/\.\s*$/, "")) : "Orange County SOE sub-precinct layer (precinct splits tagged with their districts); Seminole County SOE precinct map"}. District turnout rolls up each precinct split to the district its piece sits in, so split precincts are divided correctly. District counts cover only the part of each district inside SD 10.</li>
  <li>${anyEst ? `<span class="est">est.</span> = estimated. ${DEST.note ? DL.esc(DEST.note) : `Seminole reports early votes by whole precinct only. Where a district line cuts a Seminole precinct, the counts of each part are estimated from its share of the precinct's voters.${DEST.eligible != null ? ` ${fmt(DEST.eligible)} eligible voters (${pct(DEST.share_of_sd10 ?? DEST.eligible / ELIG)} of SD 10) are in such parts.` : ""} Whole-precinct and SD 10 totals are exact.`}`
    : "Seminole reports early votes by whole precinct only, so a count below a whole Seminole precinct would have to be estimated and would be marked “est.”. No number on this page needed that."}</li>
  <li>Party counts: ${OC ? `${DL.esc(OC.source)}, ${DL.ocAsOf(OC.latest_report, OC.latest_early_through)}. Party = the voter's registration, not how they voted. The sheet covers Orange County only, so it describes the Orange part of SD 10; there are no party counts for Seminole or for the district layers.` : "none in this build."}</li>
  <li>Built ${M.built_utc.replace("T", " ").replace("Z", " UTC")}.</li></ul>`;

paint();
renderDetail();
renderOC();
</script>

</body>
