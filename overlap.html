.dl-scroll { overflow-x: auto; max-width: 100%; }

.dl-trend { display: block; width: 100%; height: auto; overflow: visible; }

.dl-tip .dl-row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.dl-tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.dl-muted { color: var(--muted); }
.dl-badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.dl-badge.on { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.dbound-halo { fill: none; stroke: var(--dhalo); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .85; }

/* visible cue if a table still overflows its card */

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.page > * { min-width: 0; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-stretch: 87%; font-weight: 700; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 0; text-wrap: balance; }
.asof { color: var(--muted); margin: 0; font-size: 14px; }
.asof strong { color: var(--ink); font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: end; }
.ctl { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; max-width: 100%; }

.seg button { font: inherit; font-weight: 600; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
.chk { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); padding-bottom: 6px; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; }
.legend .lt { color: var(--muted); margin-right: 4px; }
.legend button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }

.legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.legend .oc { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.mapbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; }
.mapbox svg { display: block; width: 100%; height: auto; cursor: grab; user-select: none; }
.mapbox svg.dragging { cursor: grabbing; }
.piece { stroke: none; }
.plines { fill: none; stroke: var(--surface); stroke-width: .5; stroke-opacity: .7; vector-effect: non-scaling-stroke; pointer-events: none; }
.hatch { pointer-events: none; }
.oline-halo { fill: none; stroke: var(--dhalo); stroke-width: 5; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .8; }
.oline { fill: none; stroke: var(--dline); stroke-width: 2.4; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.hl { fill: none; stroke: var(--dline); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.seld { fill: none; stroke: var(--dline); stroke-width: 4; vector-effect: non-scaling-stroke; pointer-events: none; stroke-linejoin: round; }
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
.zoom button { width: 34px; height: 34px; font: inherit; font-size: 18px; font-weight: 600; line-height: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.zoom button.reset { font-size: 12px; }
.maphint { display: block; font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
.tip .rowhead, .piecebox .rowhead { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.tip .whole, .piecebox .whole { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgb(0 0 0 / .14); min-width: 190px; z-index: 5; }
.tip b { font-family: var(--font-display); font-stretch: 87%; font-size: 15px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .row span:first-child { color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.tag { font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.tag.oc { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.detail h2 { font-family: var(--font-display); font-stretch: 87%; font-size: 24px; margin: 0; line-height: 1.1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

.note { font-size: 12.5px; color: var(--muted); margin: 0; }

.xthead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; }
h2.sec { font-family: var(--font-display); font-stretch: 87%; font-size: 20px; margin: 0; }
.xtctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.xtctl label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.scroll { overflow: auto; max-height: 680px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.ocm { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 4px; letter-spacing: .04em; }

.notes { font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 80ch; }
.notes h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--ink); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .seg button { padding: 6px 9px; font-size: 13px; } }
@media (pointer: coarse) { .legend button { min-height: 40px; } .zoom button { width: 40px; height: 40px; } .mini td { padding-block: 9px; } }
.mini tbody tr:focus-visible, table.x tbody th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
